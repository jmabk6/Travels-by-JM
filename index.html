<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voyages">
<meta name="theme-color" content="#1B2A41">
<title>Mes Voyages</title>
<style>
:root{
  --paper:#F5F2EA; --card:#FBFAF6; --ink:#1B2A41; --ink-2:#6B7689;
  --sea:#0E7C86; --sea-deep:#0B5F67; --sun:#C98A2B; --good:#4F8A5B; --coral:#C75D4F;
  --line:#E4DECF; --line-2:#EEE9DC;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
.app{max-width:430px;margin:0 auto;min-height:100vh}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 14px) 16px 12px;background:rgba(245,242,234,.95);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{color:var(--sea);font-weight:600;font-size:15px;white-space:nowrap}
.top h1{flex:1;font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .add{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--sea);color:#fff;font-size:22px;line-height:34px;text-align:center}
.top .sp{width:34px;flex:0 0 auto}

.wrap{padding:6px 16px calc(var(--safe-b) + 96px)}

/* day */
.day{margin:22px 0 6px}
.day-banner{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:18px;
  background:linear-gradient(135deg,var(--sea-deep),var(--sea) 72%,#1A9AA0);color:#fff;
  box-shadow:0 8px 20px rgba(11,95,103,.22)}
.day-num{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);
  border:1.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:21px;font-weight:600}
.day-meta{flex:1;min-width:0}
.day-date{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#F4D9A2}
.day-title{font-family:var(--serif);font-size:18.5px;font-weight:600;line-height:1.18;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-edit{flex:0 0 auto;align-self:flex-start;font-size:12px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.18);padding:5px 11px;border-radius:999px}
.steps{display:flex;flex-direction:column;gap:9px;padding:11px 0 0}
.ev-empty{font-size:13px;color:var(--ink-2);padding:8px 4px}

/* event card */
.ev{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:9px 12px 9px 10px}
.ev-time{flex:0 0 44px;text-align:right;font-size:11.5px;font-weight:700;color:var(--sea-deep);line-height:1.35;white-space:nowrap}
.ev-chip{flex:0 0 auto;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--gb)}
.ev-body{flex:1;min-width:0}
.ev-ttl{font-size:15px;font-weight:600;line-height:1.26}
.ev-tag{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gc);margin-top:3px}
.ev-chev{flex:0 0 auto;color:var(--ink-2);font-size:19px}

/* highlight (visites, nature, activités) */
.ev.t-hi{border:1px solid var(--gb);border-left:4px solid var(--gc);box-shadow:0 4px 13px rgba(27,42,65,.07)}
.ev.t-hi .ev-ttl{font-size:16.5px;font-weight:700}
.ev.t-hi .ev-chip{width:44px;height:44px;font-size:22px}

/* muted (trajets) — en retrait */
.ev.t-mute{background:transparent;border:none;border-radius:0;padding:1px 12px 1px 10px;opacity:.6}
.ev.t-mute .ev-chip{width:26px;height:26px;border-radius:9px;font-size:13px;background:#E9E6DD}
.ev.t-mute .ev-ttl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ev.t-mute .ev-tag{display:none}
.ev.t-mute .ev-time{font-size:10.5px;color:var(--ink-2);font-weight:600}
.ev.t-mute .ev-chev{font-size:15px;opacity:.7}

/* done */
.ev.done{opacity:.5}
.ev.done .ev-ttl{text-decoration:line-through}

.addday{display:block;width:100%;text-align:center;margin-top:22px;color:var(--sea);font-weight:600;font-size:14px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.ver{text-align:center;color:var(--ink-2);font-size:11px;opacity:.5;margin-top:26px}
.empty{text-align:center;color:var(--ink-2);padding:24px}

/* detail */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sea-deep)}
.d-title{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.18;margin:6px 0 10px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.pill.ok{background:#dfeee2;color:#34663f;border:1px solid #cae0cf}
.pill.no{background:#fbe7e3;color:#a23c2e;border:1px solid #f0cabf}
.sec-lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:20px 0 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.row:last-child{border-bottom:none}
.row .k{flex:0 0 116px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding-top:2px}
.row .v{flex:1;font-weight:500}
.row .v a{color:var(--sea);font-weight:600;text-decoration:none}
.row.cost .v{font-weight:700;color:var(--sea-deep);font-size:16px}
.act{display:flex;align-items:center;gap:11px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;font-weight:600;margin-bottom:9px}
.act>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.actrow input{margin-bottom:6px}
.actrow .ah{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-bottom:7px}
.actadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.actadd button{flex:1;min-width:46%;border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--sea)}
.filebtn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;font-size:14px;font-weight:600;color:var(--sea)}
.filebtn input{display:none}
.speedrow{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin:2px 0 10px;flex-wrap:wrap}
.spd{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--ink)}
.spd.on{background:var(--sea);border-color:var(--sea);color:#fff}
.imgview{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px}
.imgview.on{display:flex}.imgview img{max-width:100%;max-height:100%;border-radius:8px}
.act .ic{font-size:18px;width:22px;text-align:center}
.act .go{margin-left:auto;color:var(--sea);font-size:18px}
.notes-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.5;color:#3c4658;white-space:pre-wrap}
.statusbar{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--sea);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.chk.on{background:var(--sea)}

/* buttons */
.btn{display:block;width:100%;text-align:center;border-radius:12px;padding:13px;font-weight:650;font-size:15.5px;margin-top:10px;border:1.5px solid transparent}
.btn.primary{background:var(--sea);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.del{background:transparent;border-color:var(--line);color:var(--coral)}
.btn.sm{padding:9px;font-size:14px;margin-top:0}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(27,42,65,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:18px 18px calc(var(--safe-b) + 22px);max-height:92vh;overflow:auto}
.sheet h2{font-family:var(--serif);font-size:20px;margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
.field input[type=time]{text-align:left}
.field input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.field.r2{display:flex;gap:10px}.field.r2>div{flex:1;min-width:0}
.timerow{display:flex;justify-content:space-between;gap:12px}
.timerow input[type=time]{width:118px;text-align:center}
.timerow>div:last-child{text-align:right}
.lienrow{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff}
.lienrow input{margin-bottom:6px}
.lienrow input:last-of-type{margin-bottom:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---- V59 : onglets + vues Aujourd'hui / Réservations / Infos ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;width:100%;max-width:430px;margin:0 auto;background:rgba(251,250,246,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(var(--safe-b) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:10px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.tab .ti{font-size:21px;line-height:1}
.tab.on{color:var(--sea)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:10.5px;font-weight:800;color:#fff;vertical-align:middle}
.today-hero{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--sea-deep),var(--sea) 70%,#1A9AA0);box-shadow:0 10px 24px rgba(11,95,103,.24);margin:8px 0 4px}
.today-k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#F4D9A2}
.today-h{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15;margin-top:3px}
.today-now{margin-top:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:13px;padding:11px 13px}
.today-now .lbl{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.88}
.today-now .v{font-size:15.5px;font-weight:650;margin-top:2px;line-height:1.3}
.countdown{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;margin-top:2px}
.resa{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px}
.resa-dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%}
.resa-b{flex:1;min-width:0}
.resa-t{font-size:14.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resa-m{font-size:12px;color:var(--ink-2);margin-top:2px}
.resa-call{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--sea);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.grp-h{display:flex;align-items:center;gap:9px;margin:20px 2px 11px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:11px}
.info-card h3{font-family:var(--serif);font-size:16.5px;font-weight:600;margin-bottom:5px}
.info-line{font-size:14px;line-height:1.55;color:#3c4658}
.info-line a{color:var(--sea);font-weight:600}
.copybtn{display:inline-block;margin-top:10px;border:1px solid var(--sea);color:var(--sea);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 17px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%;text-align:center}
.toast.on{opacity:.96}
.stars{display:inline-flex;gap:6px;font-size:30px;line-height:1;color:#D9D2C2}
.stars .star{cursor:pointer}
.stars .star.on{color:var(--sun)}
.avis-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:2px}
.avis-txt{font-size:14px;line-height:1.5;color:#3c4658;white-space:pre-wrap;margin-top:11px}
.avis-card .copybtn{margin-top:12px}
.day-rate{display:flex;align-items:center;gap:13px;padding:9px 4px 0;flex-wrap:wrap}
.day-rate .stars{font-size:20px;gap:4px}
.day-rate .mot{font-size:12.5px;font-weight:700;color:var(--sea)}
.ev-stars{color:var(--sun);letter-spacing:1px}
.ev.is-resto{background:#F6E7DD;border-color:#E7D2C2}
.ev.is-detente{background:#EDF4EA;border-color:#DCE8D5}
.ev.is-transport .ev-ttl{color:#969FAC;font-weight:600}
.frise{padding:10px 4px 2px}
.fr-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.fr-seg{height:100%}
.fr-seg+.fr-seg{border-left:1px solid rgba(255,255,255,.55)}
.fr-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.fr-leg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="imgview" id="imgView" onclick="closeImg()"></div>

<script>
"use strict";
const VERSION="v77";
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function readImage(file,max=1600,q=0.82){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
function dataUrlToBlob(d){const p=d.split(",");const mime=(p[0].match(/:(.*?);/)||[])[1]||"application/octet-stream";const bin=atob(p[1]);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime});}
function dirUrl(dep,arr){return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(dep||"")+"&destination="+encodeURIComponent(arr||"");}
function mapUrl(adr){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(adr||"");}
const FR_D=["dim","lun","mar","mer","jeu","ven","sam"],FR_M=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function dShort(iso){if(!iso)return"";const d=new Date(iso+"T12:00");return FR_D[d.getDay()]+" "+d.getDate()+" "+FR_M[d.getMonth()];}
const FR_DL=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
function dLong(iso){if(!iso)return"";const d=new Date(iso+"T12:00");return FR_DL[d.getDay()]+" "+d.getDate()+" "+FR_M[d.getMonth()];}
function fmtTime(s){return s?String(s).replace(":","h"):"";}
function timeStack(e){const a=fmtTime(e.debut),b=fmtTime(e.fin);return a?(b?a+"<br>"+b:a):"";}

/* ---- groupes : champs spécifiques [clé,libellé] (en plus du tronc commun) ---- */
const GROUPS={
 "Vol":[["compagnie","Compagnie"],["num","N° de vol"],["duree","Durée de vol"],["ref","Dossier / réf."],["sieges","Sièges"],["terminal","Terminal / porte"],["bagages","Bagages"]],
 "Transport":[["compagnie","Compagnie"],["ref","N° de réservation"],["depart","Lieu de départ"],["arrivee","Lieu d'arrivée"],["place","Place / siège"]],
 "Voiture":[["loueur","Loueur"],["ref","N° de réservation"],["prise","Lieu de prise"],["restitution","Lieu de restitution"],["modele","Modèle"],["assurance","Assurance"]],
 "Trajet":[["depart","Départ"],["arrivee","Arrivée"],["duree","Durée estimée"],["distance","Distance"]],
 "Hôtel":[["ref","N° de réservation"],["checkin","Check-in"],["checkout","Check-out"],["chambre","N° de chambre"],["formule","Formule"]],
 "Restaurant":[["cuisine","Cuisine"],["heure","Heure de réservation"]],
 "Visite":[["horaires","Horaires d'ouverture"],["billet","N° de billet"],["dureec","Durée conseillée"]],
 "Activité":[["prestataire","Prestataire"],["ref","N° de réservation"],["duree","Durée"]],
 "Nature":[["depart","Départ"],["distance","Distance"],["duree","Durée"],["denivele","Dénivelé / difficulté"],["acces","Accès / parking"]],
 "Bien-être":[["prestataire","Institut / prestataire"],["heure","Heure de réservation"],["duree","Durée"]],
 "Autre":[]
};
const GROUP_NAMES=Object.keys(GROUPS);
const GMETA={
 "Vol":{i:"✈️",c:"#4A6582",b:"#E7ECF1",t:"warm"},
 "Transport":{i:"⛴️",c:"#3E8E9C",b:"#E2F0F1",t:"warm"},
 "Voiture":{i:"🚗",c:"#5E6E84",b:"#E9ECF1",t:"warm"},
 "Trajet":{i:"🚗",c:"#A0A6AD",b:"#ECEAE3",t:"mute"},
 "Hôtel":{i:"🏨",c:"#0E7C86",b:"#DEEFEF",t:"warm"},
 "Restaurant":{i:"🍽️",c:"#C2693F",b:"#F6E7DD",t:"warm"},
 "Visite":{i:"🏛️",c:"#C75D4F",b:"#F8E7E3",t:"hi"},
 "Activité":{i:"🎨",c:"#C98A2B",b:"#F7EEDB",t:"hi"},
 "Nature":{i:"🌿",c:"#4F8A5B",b:"#E6F1E8",t:"hi"},
 "Bien-être":{i:"💆",c:"#5AA0A6",b:"#E3F1F1",t:"warm"},
 "Autre":{i:"📍",c:"#6B7689",b:"#ECEDEE",t:"warm"}
};
function gmeta(g){return GMETA[g]||GMETA["Autre"];}
function fToChamps(groupe,f){f=f||{};const defs=GROUPS[groupe]||[];const out=defs.map(([k,l])=>({label:l,value:f[k]||""}));
  Object.keys(f).forEach(k=>{if(!defs.some(d=>d[0]===k)&&f[k])out.push({label:k,value:f[k]});});return out;}
const NAME_L=["nom"],ADDR_L=["adresse","adresse / lieu","lieu"],TEL_L=["téléphone","telephone","tél","tel"];
function chFind(e,set){return (e.champs||[]).find(c=>set.includes((c.label||"").trim().toLowerCase()));}
function etName(e){if(e.titre&&e.titre.trim())return e.titre;const f=(e.champs||[]).find(c=>c.value);return f?f.value:"(sans nom)";}
function etAddr(e){const c=chFind(e,ADDR_L);return c?c.value:"";}
function etTel(e){const c=chFind(e,TEL_L);return c?c.value:"";}
function chVal(e,label){
  const lc=String(label||"").trim().toLowerCase();
  const c=(e.champs||[]).find(x=>String(x.label||"").trim().toLowerCase()===lc);
  return c?c.value:"";
}
function cleanTel(t){return String(t||"").replace(/[^+0-9]/g,"");}
function bestPlaceQuery(e){
  const addr=etAddr(e);
  const name=etName(e);
  return addr || (name!=="(sans nom)" ? name : "");
}
function navUrl(dest){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest||"");}
function defChamps(groupe){const base=["Adresse","Téléphone"];const grp=(GROUPS[groupe]||[]).map(([k,l])=>l);return base.concat(grp).map(l=>({label:l,value:""}));}

/* ---- storage ---- */
let DB=null,MEM={},useMem=false;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("voyages2",1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore("kv");};
  r.onsuccess=e=>{DB=e.target.result;res();}; r.onerror=()=>{useMem=true;res();};}catch(e){useMem=true;res();}});}
function getKV(k){return new Promise(r=>{if(useMem)return r(MEM[k]);const t=DB.transaction("kv","readonly").objectStore("kv").get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(undefined);});}
function putKV(k,v){return new Promise(r=>{if(useMem){MEM[k]=v;return r();}const t=DB.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=()=>r();t.onerror=()=>r();});}

let DATA=null,view="aujourdhui",prevView="aujourdhui",cur=null,SPK=null,itinScroll=0;
async function save(){await putKV("data",DATA);}
async function load(){const s=await getKV("data");
  /* V57 : on ne RÉINITIALISE plus jamais sur changement de version.
     Dès qu'il existe des données valides sur l'appareil, on les garde (la vérité = ton iPhone).
     Le seed ne sert qu'au tout premier lancement, quand rien n'est encore stocké. */
  if(s&&s.trip&&Array.isArray(s.trip.jours)){DATA=s;DATA.version=VERSION;migrate();}
  else{DATA=seed();migrate();}
  await save();}
function migrate(){if(!DATA.infos)DATA.infos=defaultInfos();const t=DATA.trip;if(!t)return;(t.jours||[]).forEach(j=>(j.etapes||[]).forEach(e=>{
  if(e.champs===undefined){e.champs=fToChamps(e.groupe,e.f||{});delete e.f;}
  if("nom"in e||"lieu"in e||"tel"in e){
    const has=l=>e.champs.some(c=>(c.label||"").trim().toLowerCase()===l.toLowerCase());
    const head=[];
    if(!has("Nom"))head.push({label:"Nom",value:e.nom||""});
    if(!has("Adresse"))head.push({label:"Adresse",value:e.lieu||""});
    if(!has("Téléphone"))head.push({label:"Téléphone",value:e.tel||""});
    e.champs=head.concat(e.champs);delete e.nom;delete e.lieu;delete e.tel;
  }
  if(e.actions===undefined){e.actions=(e.liens||[]).filter(l=>l&&(l.label||l.url)).map(l=>({type:"lien",label:l.label||"",url:l.url||""}));delete e.liens;}
  (e.actions||[]).forEach(a=>{if(a.type==="plan")a.type="itineraire";});
  if(e.titre===undefined){const ni=(e.champs||[]).findIndex(c=>(c.label||"").trim().toLowerCase()==="nom");if(ni>=0){e.titre=e.champs[ni].value||"";e.champs.splice(ni,1);}else e.titre="";}
  if(e.groupe==="Autre"&&/^\s*(petit[- ]?d[ée]j|brunch|go[uû]ter)/i.test(e.titre||""))e.groupe="Restaurant";
}));}
const trip=()=>DATA.trip;
function sortDay(j){if(j&&j.etapes)j.etapes.sort((a,b)=>(a.debut||"99:99").localeCompare(b.debut||"99:99"));}

/* ---- render ---- */
function render(){
  if(view==="detail")return renderDetail();
  if(view==="aujourdhui")return renderToday();
  if(view==="resas")return renderResas();
  if(view==="infos")return renderInfos();
  renderItin();
}

function renderItin(){
  const t=trip();
  const days=[...t.jours].sort((a,b)=>(a.date||"")<(b.date||"")?-1:1).map((j,di)=>{sortDay(j);
    const evs=(j.etapes||[]).map(e=>evCard(j,e)).join("")
      ||'<div class="ev-empty">Aucune étape — touche « Modifier » pour en ajouter.</div>';
    return `<div class="day">
      <div class="day-banner">
        <div class="day-num">${di+1}</div>
        <div class="day-meta"><div class="day-date">${dLong(j.date)||"Jour "+(di+1)}</div><div class="day-title">${esc(j.titre)}</div></div>
        <button class="day-edit" onclick="event.stopPropagation();editDay('${j.id}')">Modifier</button>
      </div>
      ${dayRateStrip(j)}
      ${daySummary(j)}
      <div class="steps">${evs}</div>
    </div>`;
  }).join("");
  $("app").innerHTML=`
    <div class="top"><button class="add" style="background:var(--card);color:var(--sea);border:1px solid var(--line);font-size:20px" onclick="openSettings()">⋯</button><h1>${esc(t.titre)}</h1><button class="add" onclick="editDay()">+</button></div>
    <div class="wrap">${t.jours.length?days:'<div class="empty">Aucune journée.</div>'}
      <button class="addday" onclick="editDay()">+ Ajouter une journée</button>
      <div class="ver">Mes Voyages · ${VERSION}</div>
    </div>${tabBar('itin')}`;
}

function renderDetail(){
  const j=trip().jours.find(x=>x.id===cur.jid);const e=j&&j.etapes.find(x=>x.id===cur.eid);
  if(!e){view="itin";return render();}
  const nm=etName(e),addr=etAddr(e),tel=etTel(e);
  const q=encodeURIComponent(addr||(nm!=="(sans nom)"?nm:""));
  const rows=[];
  (e.champs||[]).forEach(c=>{const lc=(c.label||"").trim().toLowerCase();if(c.value&&lc!=="nom"){let v;if(TEL_L.includes(lc)){v=`<a href="tel:${esc(c.value).replace(/\s/g,'')}">${esc(c.value)}</a>`;}else if(ADDR_L.includes(lc)){const m=c.value.match(/^(.*?)\s*@\s*(-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?)\s*$/);const disp=m?m[1].trim():c.value;const q=m?m[2].replace(/\s/g,''):c.value;v=`<a href="${mapUrl(q)}" target="_blank" rel="noopener">${esc(disp)} ↗</a>`;}else{v=esc(c.value);}rows.push(`<div class="row"><span class="k">${esc(c.label||"—")}</span><span class="v">${v}</span></div>`);}});
  if(e.cout)rows.push(`<div class="row cost"><span class="k">Coût</span><span class="v">${esc(e.cout)}</span></div>`);
  const reservePill=e.reserve===true?'<span class="pill ok">Réservé</span>':e.reserve===false?'<span class="pill no">À réserver</span>':e.reserve==='na'?'<span class="pill" style="background:#E9E6DD;color:#6B5E50">Non réservable</span>':"";
  const acts=[];
  /* Actions automatiques V56 : affichées en premier si les infos existent */
  const placeQ=bestPlaceQuery(e);
  if(tel){
    acts.push(`<a class="act" href="tel:${esc(cleanTel(tel))}"><span class="ic">📞</span><span>Appeler</span><span class="go">›</span></a>`);
  }
  if(placeQ){
    acts.push(`<a class="act" href="${mapUrl(placeQ)}" target="_blank" rel="noopener"><span class="ic">📍</span><span>Ouvrir dans Google Maps</span><span class="go">›</span></a>`);
    acts.push(`<a class="act" href="${navUrl(placeQ)}" target="_blank" rel="noopener"><span class="ic">🚗</span><span>Itinéraire depuis ma position</span><span class="go">›</span></a>`);
  }
  if((e.groupe||"")==="Trajet"){
    const dep=chVal(e,"Départ"), arr=chVal(e,"Arrivée");
    if(dep||arr){
      acts.push(`<a class="act" href="${dirUrl(dep,arr)}" target="_blank" rel="noopener"><span class="ic">🧭</span><span>Trajet prévu : ${esc(dep||"Départ")} → ${esc(arr||"Arrivée")}</span><span class="go">›</span></a>`);
    }
  }
  (e.actions||[]).forEach((a,ai)=>{
    if(a.type==="lien"&&(a.label||a.url))acts.push(`<a class="act" ${a.url?`href="${esc(a.url)}" target="_blank" rel="noopener"`:""}><span class="ic">🔗</span><span>${esc(a.label||a.url||"Lien")}</span><span class="go">›</span></a>`);
    else if(a.type==="adresse"&&a.adresse)acts.push(`<a class="act" href="${mapUrl(a.adresse)}" target="_blank" rel="noopener"><span class="ic">📍</span><span>${esc(a.label||a.adresse)}</span><span class="go">›</span></a>`);
    else if(a.type==="itineraire"&&(a.depart||a.arrivee))acts.push(`<a class="act" href="${dirUrl(a.depart,a.arrivee)}" target="_blank" rel="noopener"><span class="ic">🧭</span><span>${esc(a.label||((a.depart||"?")+" → "+(a.arrivee||"?")))}</span><span class="go">›</span></a>`);
    else if(a.type==="fichier"&&a.data)acts.push(`<a class="act" onclick="openAtt('${j.id}','${e.id}',${ai})"><span class="ic">📄</span><span>${esc(a.label||a.name||"Fichier")}</span><span class="go">›</span></a>`);
    else if(a.type==="photo"&&a.data)acts.push(`<a class="act" onclick="openImg('${j.id}','${e.id}',${ai})"><span class="ic">🖼</span><span>${esc(a.label||a.name||"Photo")}</span><span class="go">›</span></a>`);
    else if(a.type==="audio"&&a.texte){const pl=SPK&&SPK.jid===j.id&&SPK.eid===e.id&&SPK.ai===ai;acts.push(`<a class="act" onclick="speakAction('${j.id}','${e.id}',${ai})"><span class="ic">${pl?"⏸":"🔊"}</span><span>${pl?"Lecture en cours… (toucher pour arrêter)":esc(a.label||"Audio")}</span><span class="go">›</span></a>`);}
  });
  $("app").innerHTML=`
    <div class="top"><button class="back" onclick="back()">‹ ${esc(backLabel())}</button><h1>${esc(j.titre)}</h1><span class="sp"></span></div>
    <div class="wrap">
      <div class="eyebrow">${[timeStack(e).replace("<br>"," – "),e.groupe].filter(Boolean).join(" · ")}</div>
      <div class="d-title">${esc(nm)}${e.groupe==='Vol'&&(chVal(e,"Durée de vol")||chVal(e,"Durée"))?` <span style="font-size:.7em;color:var(--ink-2);font-weight:500">(${esc(chVal(e,"Durée de vol")||chVal(e,"Durée"))})</span>`:""}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0">
        <div>${reservePill}</div>
        <div class="statusbar" style="margin:0"><div class="chk ${e.statut==='fait'?'on':''}" onclick="toggleDone('${j.id}','${e.id}')">${e.statut==='fait'?'✓':''}</div>
          <span style="font-size:13px;color:var(--ink-2)">${e.statut==='fait'?'Fait':'À faire'}</span></div>
      </div>
      ${rows.length?`<div class="sec-lbl">Infos</div><div class="card">${rows.join("")}</div>`:""}
      ${acts.length?`<div class="sec-lbl">Actions</div>${(e.actions||[]).some(a=>a.type==="audio"&&a.texte)?(()=>{const rate=DATA.audioRate||0.85;const mk=(r,l)=>`<button class="spd${Math.abs(rate-r)<0.01?' on':''}" onclick="setRate(${r})">${l}</button>`;return `<div class="speedrow">🔊 Vitesse&nbsp;: ${mk(0.7,'Lent')}${mk(0.85,'Moyen')}${mk(1,'Normal')}</div>`;})():""}${acts.join("")}`:""}
      ${e.notes?`<div class="sec-lbl">Notes</div><div class="notes-box">${esc(e.notes)}</div>`:""}
      <div class="sec-lbl">Mon avis</div>
      <div class="avis-card">
        <div class="stars">${[1,2,3,4,5].map(i=>`<span class="star ${i<=(e.note||0)?'on':''}" onclick="rateEvent(${i})">★</span>`).join("")}</div>
        ${e.commentaire?`<div class="avis-txt">${esc(e.commentaire)}</div>`:""}
        <button class="copybtn" onclick="editComment()">${e.commentaire?"✎ Modifier mon commentaire":"+ Ajouter un commentaire"}</button>
      </div>
      <button class="btn primary" onclick="editEvent('${j.id}','${e.id}')">Modifier l'étape</button>
      <button class="btn del" onclick="delEvent('${j.id}','${e.id}')">Supprimer l'étape</button>
    </div>`;
}

/* ============ V59 : vues Aujourd'hui / Réservations / Infos ============ */
function todayISO(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function nowHM(){const d=new Date(),p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes());}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/86400000);}
function parseAddr(v){const m=String(v||"").match(/^(.*?)\s*@\s*(-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?)\s*$/);return m?{disp:m[1].trim(),q:m[2].replace(/\s/g,'')}:{disp:String(v||""),q:String(v||"")};}

function isRepas(e){if(e.groupe==="Restaurant")return true;return /petit[- ]?d[ée]j|d[ée]jeuner|d[îi]ner|brunch|go[uû]ter/i.test(e.titre||"");}
function evCard(j,e){const m=gmeta(e.groupe);
  return `<div class="ev t-${m.t} ${isRepas(e)?'is-resto':(macroOf(e.groupe)==='detente'?'is-detente':(e.groupe==='Vol'||e.groupe==='Transport'?'is-transport':''))} ${e.statut==='fait'?'done':''}" style="--gc:${m.c};--gb:${m.b}" onclick="openDetail('${j.id}','${e.id}')">
    <div class="ev-time">${timeStack(e)}</div>
    <div class="ev-chip">${m.i}</div>
    <div class="ev-body"><div class="ev-ttl">${esc(etName(e))}${e.groupe==='Vol'&&(chVal(e,"Durée de vol")||chVal(e,"Durée"))?` (${esc(chVal(e,"Durée de vol")||chVal(e,"Durée"))})`:""}</div><div class="ev-tag">${esc(e.groupe||"")}${e.note?` · <span class="ev-stars">${"★".repeat(e.note)}</span>`:""}</div></div>
    <span class="ev-chev">›</span></div>`;}

function tabBar(active){
  const t=trip();let nb=0;
  (t.jours||[]).forEach(j=>(j.etapes||[]).forEach(e=>{if(e.reserve===false)nb++;}));
  const tb=(v,ic,lbl,badge)=>`<button class="tab ${active===v?'on':''}" onclick="go('${v}')"><span class="ti">${ic}</span><span>${lbl}${badge?` <span class="badge" style="background:var(--coral)">${badge}</span>`:""}</span></button>`;
  return `<div class="tabbar">${tb('aujourdhui','📅',"Auj.",0)}${tb('itin','🗺️','Itinéraire',0)}${tb('resas','🎟️','Résas',nb)}${tb('infos','ℹ️','Infos',0)}</div>`;
}
function go(v){if(view!=="detail")prevView=view;view=v;cur=null;render();window.scrollTo(0,0);}
function topGeneric(titre){return `<div class="top"><button class="add" style="background:var(--card);color:var(--sea);border:1px solid var(--line);font-size:20px" onclick="openSettings()">⋯</button><h1>${esc(titre)}</h1><span class="sp"></span></div>`;}
function backLabel(){return {aujourdhui:"Aujourd'hui",itin:"Itinéraire",resas:"Réservations",infos:"Infos"}[prevView]||"Retour";}

function renderToday(){
  const t=trip();const jours=[...t.jours].sort((a,b)=>(a.date||"")<(b.date||"")?-1:1);
  const today=todayISO();
  const start=jours.length?jours[0].date:null,end=jours.length?jours[jours.length-1].date:null;
  let hero="",body="";
  const jT=jours.find(j=>j.date===today);
  if(jT){
    sortDay(jT);const now=nowHM();const steps=jT.etapes||[];let cur2=null,nx=null;
    steps.forEach(e=>{if(e.debut&&e.debut<=now&&(!e.fin||e.fin>now))cur2=e;});
    nx=steps.find(e=>e.debut&&e.debut>now);
    const di=jours.indexOf(jT)+1;
    const nowB=cur2?`<div class="today-now"><div class="lbl">⟡ Maintenant</div><div class="v">${esc(etName(cur2))}${cur2.fin?` · jusqu'à ${fmtTime(cur2.fin)}`:""}</div></div>`:"";
    const nxB=nx?`<div class="today-now"><div class="lbl">→ Ensuite</div><div class="v">${nx.debut?fmtTime(nx.debut)+" · ":""}${esc(etName(nx))}</div></div>`:(cur2?"":`<div class="today-now"><div class="v">Journée terminée — bonne soirée 🌙</div></div>`);
    hero=`<div class="today-hero"><div class="today-k">${dLong(today)} · Jour ${di}</div><div class="today-h">${esc(jT.titre)}</div>${nowB}${nxB}</div>`;
    const bilan=`<div class="sec-lbl">Ton bilan du jour</div><div class="avis-card"><div class="stars">${[1,2,3,4,5].map(i=>`<span class="star ${i<=(jT.note||0)?'on':''}" onclick="rateDay('${jT.id}',${i})">★</span>`).join("")}</div>${jT.commentaire?`<div class="avis-txt">${esc(jT.commentaire)}</div>`:""}<button class="copybtn" onclick="editDayComment('${jT.id}')">${jT.commentaire?"✎ Modifier le mot du jour":"+ Ajouter un mot sur la journée"}</button></div>`;
    body=`${daySummary(jT)?`<div class="sec-lbl">La forme du jour</div>${daySummary(jT)}`:""}<div class="sec-lbl">Le programme du jour</div><div class="steps">${steps.map(e=>evCard(jT,e)).join("")||'<div class="ev-empty">Rien de prévu aujourd’hui.</div>'}</div>${bilan}`;
  }else if(start&&today<start){
    const dd=daysBetween(today,start);const j1=jours[0];sortDay(j1);
    hero=`<div class="today-hero"><div class="today-k">${esc(t.titre)}</div><div class="today-h">Départ ${dLong(start)}</div><div class="today-now" style="text-align:center"><div class="lbl">Plus que</div><div class="countdown">J-${dd}</div></div></div>`;
    body=`${daySummary(j1)?`<div class="sec-lbl">La forme du jour</div>${daySummary(j1)}`:""}<div class="sec-lbl">Le premier jour — ${esc(j1.titre)}</div><div class="steps">${(j1.etapes||[]).map(e=>evCard(j1,e)).join("")}</div>`;
  }else if(end&&today>end){
    hero=`<div class="today-hero"><div class="today-k">${esc(t.titre)}</div><div class="today-h">Voyage terminé ✨</div><div class="today-now"><div class="v">J’espère que c’était magnifique. Toutes tes données sont conservées.</div></div></div>`;
  }else{
    hero=`<div class="today-hero"><div class="today-h">${esc(t.titre)}</div></div>`;
  }
  $("app").innerHTML=topGeneric("Aujourd'hui")+`<div class="wrap">${hero}${body}</div>`+tabBar('aujourdhui');
}

function renderResas(){
  const t=trip();const jours=[...t.jours].sort((a,b)=>(a.date||"")<(b.date||"")?-1:1);
  const bk={f:[],t:[],na:[]};
  jours.forEach(j=>(j.etapes||[]).forEach(e=>{if(e.reserve===false)bk.f.push([j,e]);else if(e.reserve===true)bk.t.push([j,e]);else if(e.reserve==="na")bk.na.push([j,e]);}));
  const row=(j,e,color)=>{const tel=etTel(e);return `<div class="resa" onclick="openDetail('${j.id}','${e.id}')"><span class="resa-dot" style="background:${color}"></span><div class="resa-b"><div class="resa-t">${esc(etName(e))}</div><div class="resa-m">${esc(dShort(j.date))}${e.debut?" · "+fmtTime(e.debut):""}</div></div>${tel?`<a class="resa-call" href="tel:${esc(cleanTel(tel))}" onclick="event.stopPropagation()">📞</a>`:""}</div>`;};
  const sec=(title,arr,color)=>arr.length?`<div class="grp-h">${title} <span class="badge" style="background:${color}">${arr.length}</span></div>${arr.map(([j,e])=>row(j,e,color)).join("")}`:"";
  const html=(sec("🔴 À réserver",bk.f,"#C75D4F")+sec("🟢 Réservé",bk.t,"#4F8A5B")+sec("⚪ Sans réservation",bk.na,"#9AA0A8"))||'<div class="empty">Aucune réservation à suivre.</div>';
  $("app").innerHTML=topGeneric("Réservations")+`<div class="wrap">${html}</div>`+tabBar('resas');
}

function defaultInfos(){return {
  regimeEn:"My wife eats only fish and vegetarian dishes (no meat, no shellfish/molluscs); I don't eat pork.",
  regimeFr:"Ma femme mange uniquement du poisson et des plats végétariens (pas de viande, ni crustacés ni mollusques). Moi, pas de porc.",
  urgences:[{label:"Urgences (UE)",num:"112"},{label:"Police",num:"100"},{label:"Ambulance",num:"166"},{label:"Pompiers",num:"199"}],
  notes:""};}
function renderInfos(){
  const inf=DATA.infos||defaultInfos();const t=trip();
  const pick=gs=>{const out=[],seen={};(t.jours||[]).forEach(j=>(j.etapes||[]).forEach(e=>{if(gs.includes(e.groupe)){const k=etAddr(e)||etName(e);if(k&&!seen[k]){seen[k]=1;out.push(e);}}}));return out;};
  const fieldRow=(e,lbls)=>lbls.map(l=>{const v=chVal(e,l);return v?`<div class="info-line"><b>${esc(l)} :</b> ${esc(v)}</div>`:"";}).join("");
  const card=(e,byAddr)=>{const addr=etAddr(e),tel=etTel(e),pa=addr?parseAddr(addr):null;const title=byAddr&&pa?pa.disp:etName(e);
    return `<div class="info-card"><h3>${esc(title)}</h3>${pa?`<div class="info-line">📍 <a href="${mapUrl(pa.q)}" target="_blank" rel="noopener">${byAddr?"Ouvrir dans Maps":esc(pa.disp)+" ↗"}</a></div>`:""}${tel?`<div class="info-line">📞 <a href="tel:${esc(cleanTel(tel))}">${esc(tel)}</a></div>`:""}${fieldRow(e,["N° de réservation","Check-in","Check-out","N° de chambre","Formule","N° de vol","Dossier / réf.","Sièges","Loueur"])}</div>`;};

/* ============ V61 : synthèse + frise de journée ============ */
function durMin(e){if(!e.debut||!e.fin)return 0;const a=e.debut.split(":"),b=e.fin.split(":");let d=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(d<0)d+=1440;return d>0?d:0;}
function fmtDur(min){if(min<=0)return"";const h=Math.floor(min/60),m=min%60;return h?(m?h+"h"+String(m).padStart(2,"0"):h+"h"):m+"min";}
function macroOf(g){if(["Visite","Activité","Nature"].includes(g))return"act";if(["Trajet","Vol","Transport","Voiture"].includes(g))return"trajet";return"detente";}
const MACRO={act:{label:"Visites & activités",i:"🏛️",c:"#C75D4F"},trajet:{label:"Trajets",i:"🚗",c:"#BCC2CA"},detente:{label:"Détente",i:"🌿",c:"#84BC95"}};
function daySummary(j){
  const steps=(j.etapes||[]).filter(e=>durMin(e)>0);
  if(!steps.length)return"";
  const byM={};steps.forEach(e=>{const k=macroOf(e.groupe);byM[k]=(byM[k]||0)+durMin(e);});
  const total=Object.keys(byM).reduce((s,k)=>s+byM[k],0);
  const order=["act","trajet","detente"].filter(k=>byM[k]);
  const bar=order.map(k=>{const mc=MACRO[k];return `<span class="fr-seg" style="width:${(byM[k]/total*100).toFixed(2)}%;background:${mc.c}"></span>`;}).join("");
  const legend=order.map(k=>{const mc=MACRO[k];return `<span class="fr-leg">${mc.i} ${mc.label} ${fmtDur(byM[k])}</span>`;}).join("");
  return `<div class="frise"><div class="fr-bar">${bar}</div><div class="fr-legend">${legend}</div></div>`;
}

function stopSpeak(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}SPK=null;}
function pickFrVoice(){
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^fr/i.test(v.lang||""));
  if(!vs.length)return null;
  const score=v=>{const n=(v.name||"").toLowerCase();let s=0;
    if(/fr[-_]?fr/i.test(v.lang||""))s+=2;
    if(/(amélior|amelior|enhanced|premium|neural|siri|eloquence|infovox)/.test(n))s+=6;
    if(/(thomas|aurélie|aurelie|audrey|marie|virginie|nicolas|jacques)/.test(n))s+=2;
    if(/compact/.test(n))s-=4;
    return s;};
  return vs.slice().sort((a,b)=>score(b)-score(a))[0];
}
function speakAction(jid,eid,ai){const e=trip().jours.find(x=>x.id===jid).etapes.find(x=>x.id===eid);const a=(e.actions||[])[ai];if(!a||!a.texte)return;
  if(!('speechSynthesis' in window)){alert("La lecture audio n'est pas disponible sur cet appareil.");return;}
  if(SPK&&SPK.jid===jid&&SPK.eid===eid&&SPK.ai===ai){stopSpeak();render();return;}
  stopSpeak();SPK={jid:jid,eid:eid,ai:ai};
  const chunks=a.texte.replace(/\s+/g,' ').trim().match(/[^.!?…]+[.!?…]*/g)||[a.texte];
  const fr=pickFrVoice();
  chunks.forEach((c,idx)=>{const u=new SpeechSynthesisUtterance(c.trim());u.lang="fr-FR";u.rate=DATA.audioRate||0.85;if(fr)u.voice=fr;if(idx===chunks.length-1)u.onend=()=>{if(SPK&&SPK.jid===jid&&SPK.eid===eid&&SPK.ai===ai){SPK=null;render();}};speechSynthesis.speak(u);});
  render();}

  if(jid){const j=t.jours.find(x=>x.id===jid);j.date=val("d_date");j.titre=val("d_titre");}
  else t.jours.push({id:uid(),date:val("d_date"),titre:val("d_titre")||"Journée",etapes:[]});
  await save();closeSheet();render();}
async function delDay(jid){if(!confirm("Supprimer cette journée et ses étapes ?"))return;
  trip().jours=trip().jours.filter(x=>x.id!==jid);await save();closeSheet();render();}

/* ---- sauvegarde : export / import / réinitialisation ---- */
function exportData(){
  try{
    const json=JSON.stringify(DATA);
    const d=new Date(),pad=n=>String(n).padStart(2,"0");
    const fname="voyages-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+pad(d.getHours())+pad(d.getMinutes())+".json";
    const blob=new Blob([json],{type:"application/json"});
    /* iOS : partage natif → « Enregistrer dans Fichiers » / envoyer */
    if(navigator.canShare){
      const file=new File([blob],fname,{type:"application/json"});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:"Sauvegarde Voyages"}).catch(e=>{if(e&&e.name!=="AbortError")fallbackDownload(blob,fname);});
        return;
      }
    }
    fallbackDownload(blob,fname);
  }catch(e){alert("Sauvegarde impossible : "+(e&&e.message||e));}
}
function fallbackDownload(blob,fname){
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);
}
function importData(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    try{
      const obj=JSON.parse(await f.text());
      if(!obj||!obj.trip||!Array.isArray(obj.trip.jours))throw new Error("ce fichier n'est pas une sauvegarde Voyages");
      const nj=obj.trip.jours.length;
      if(!confirm("Importer ce fichier ?\n\n"+nj+" journée(s) seront chargées et REMPLACERONT l'itinéraire actuel.\n(Pense à « Sauvegarder » avant si besoin.)"))return;
      DATA=obj;DATA.version=VERSION;migrate();await save();
      closeSheet();view="itin";cur=null;render();window.scrollTo(0,0);
      alert("Itinéraire importé ✔");
    }catch(e){alert("Import impossible : "+(e&&e.message||e));}
  };
  inp.click();
}
async function resetData(){
  if(!confirm("Revenir à l'itinéraire d'origine ?\n\nTOUTES tes modifications seront perdues."))return;
  if(!confirm("Dernière confirmation : effacer mes saisies et recharger l'itinéraire d'origine ?"))return;
  DATA=seed();await save();closeSheet();view="itin";cur=null;render();window.scrollTo(0,0);
}
function openSettings(){
  openSheet(`<h2>Sauvegarde & réglages</h2>
    <button class="btn primary" onclick="exportData()">💾 Sauvegarder mon voyage (fichier)</button>
    <button class="btn ghost" onclick="importData()">📥 Importer un fichier</button>
    <div style="font-size:12.5px;color:var(--ink-2);margin:14px 2px 0;line-height:1.55">
      <b>Pour modifier avec Claude :</b><br>1. Touche « Sauvegarder » et envoie-lui le fichier.<br>2. Il te renvoie un fichier corrigé.<br>3. Touche « Importer » et choisis ce fichier.<br>Tes saisies ne sont jamais effacées par une mise à jour.
    </div>
    <button class="btn del" style="margin-top:20px" onclick="resetData()">↩︎ Réinitialiser à l'itinéraire d'origine</button>
    <div class="ver" style="margin-top:18px">Version ${VERSION}</div>`);
}
