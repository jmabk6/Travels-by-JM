<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voyages">
<meta name="theme-color" content="#1B2A41">
<title>Mes Voyages</title>
<style>
:root{
  --paper:#F5F2EA; --card:#FBFAF6; --ink:#1B2A41; --ink-2:#6B7689;
  --sea:#0E7C86; --sea-deep:#0B5F67; --sun:#C98A2B; --good:#4F8A5B; --coral:#C75D4F;
  --line:#E4DECF; --line-2:#EEE9DC;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
.app{max-width:430px;margin:0 auto;min-height:100vh}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 14px) 16px 12px;background:rgba(245,242,234,.95);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{color:var(--sea);font-weight:600;font-size:15px;white-space:nowrap}
.top h1{flex:1;font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .add{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--sea);color:#fff;font-size:22px;line-height:34px;text-align:center}
.top .sp{width:34px;flex:0 0 auto}

.wrap{padding:6px 16px calc(var(--safe-b) + 40px)}

/* day */
.day-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
.day-h .d{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sea-deep);text-transform:uppercase}
.day-h .t{font-family:var(--serif);font-size:19px;font-weight:600;flex:1}
.day-h .edit{font-size:13px;color:var(--sea);font-weight:600}

/* event row */
.ev{display:flex;align-items:stretch}
.ev .time{flex:0 0 64px;text-align:right;padding:12px 12px 0 0;color:var(--sea-deep);font-weight:600;font-size:12.5px;line-height:1.4;white-space:nowrap}
.ev .rail{flex:0 0 18px;position:relative}
.ev .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.ev .rail .dot{position:absolute;left:3px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--sea)}
.ev.done .rail .dot{background:var(--sea)}
.ev:first-of-type .rail::before{top:15px}
.ev:last-of-type .rail::before{height:15px}
.ev .c{flex:1;padding:11px 0 14px 8px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-start;gap:8px}
.ev:last-of-type .c{border-bottom:none}
.ev .c .txt{flex:1}
.ev .ttl{font-size:15.5px;font-weight:600;line-height:1.3}
.ev.done .ttl{color:var(--ink-2);text-decoration:line-through}
.ev .sub{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.ev .chev{color:var(--sea);font-size:20px;align-self:center}

.addday{display:block;width:100%;text-align:center;margin-top:22px;color:var(--sea);font-weight:600;font-size:14px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.ver{text-align:center;color:var(--ink-2);font-size:11px;opacity:.5;margin-top:26px}
.empty{text-align:center;color:var(--ink-2);padding:24px}

/* detail */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sea-deep)}
.d-title{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.18;margin:6px 0 10px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.pill.ok{background:#dfeee2;color:#34663f;border:1px solid #cae0cf}
.pill.no{background:#fbe7e3;color:#a23c2e;border:1px solid #f0cabf}
.sec-lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:20px 0 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.row:last-child{border-bottom:none}
.row .k{flex:0 0 116px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding-top:2px}
.row .v{flex:1;font-weight:500}
.row .v a{color:var(--sea);font-weight:600;text-decoration:none}
.row.cost .v{font-weight:700;color:var(--sea-deep);font-size:16px}
.act{display:flex;align-items:center;gap:11px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;font-weight:600;margin-bottom:9px}
.act>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.actrow input{margin-bottom:6px}
.actrow .ah{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-bottom:7px}
.actadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.actadd button{flex:1;min-width:46%;border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--sea)}
.filebtn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;font-size:14px;font-weight:600;color:var(--sea)}
.filebtn input{display:none}
.speedrow{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin:2px 0 10px;flex-wrap:wrap}
.spd{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--ink)}
.spd.on{background:var(--sea);border-color:var(--sea);color:#fff}
.imgview{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px}
.imgview.on{display:flex}.imgview img{max-width:100%;max-height:100%;border-radius:8px}
.act .ic{font-size:18px;width:22px;text-align:center}
.act .go{margin-left:auto;color:var(--sea);font-size:18px}
.notes-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.5;color:#3c4658;white-space:pre-wrap}
.statusbar{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--sea);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.chk.on{background:var(--sea)}

/* buttons */
.btn{display:block;width:100%;text-align:center;border-radius:12px;padding:13px;font-weight:650;font-size:15.5px;margin-top:10px;border:1.5px solid transparent}
.btn.primary{background:var(--sea);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.del{background:transparent;border-color:var(--line);color:var(--coral)}
.btn.sm{padding:9px;font-size:14px;margin-top:0}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(27,42,65,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:18px 18px calc(var(--safe-b) + 22px);max-height:92vh;overflow:auto}
.sheet h2{font-family:var(--serif);font-size:20px;margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
.field input[type=time]{text-align:left}
.field input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.field.r2{display:flex;gap:10px}.field.r2>div{flex:1;min-width:0}
.timerow{display:flex;justify-content:space-between;gap:12px}
.timerow input[type=time]{width:118px;text-align:center}
.timerow>div:last-child{text-align:right}
.lienrow{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff}
.lienrow input{margin-bottom:6px}
.lienrow input:last-of-type{margin-bottom:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="imgview" id="imgView" onclick="closeImg()"></div>

<script>
"use strict";
const VERSION="v21";
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function readImage(file,max=1600,q=0.82){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
function dataUrlToBlob(d){const p=d.split(",");const mime=(p[0].match(/:(.*?);/)||[])[1]||"application/octet-stream";const bin=atob(p[1]);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime});}
function dirUrl(dep,arr){return "https://maps.apple.com/?"+(dep?("saddr="+encodeURIComponent(dep)+"&"):"")+"daddr="+encodeURIComponent(arr||"");}
const FR_D=["dim","lun","mar","mer","jeu","ven","sam"],FR_M=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function dShort(iso){if(!iso)return"";const d=new Date(iso+"T12:00");return FR_D[d.getDay()]+" "+d.getDate()+" "+FR_M[d.getMonth()];}
function fmtTime(s){return s?String(s).replace(":","h"):"";}
function timeStack(e){const a=fmtTime(e.debut),b=fmtTime(e.fin);return a?(b?a+"<br>"+b:a):"";}

/* ---- groupes : champs spécifiques [clé,libellé] (en plus du tronc commun) ---- */
const GROUPS={
 "Vol":[["compagnie","Compagnie"],["num","N° de vol"],["ref","Dossier / réf."],["sieges","Sièges"],["terminal","Terminal / porte"],["bagages","Bagages"]],
 "Transport":[["compagnie","Compagnie"],["ref","N° de réservation"],["depart","Lieu de départ"],["arrivee","Lieu d'arrivée"],["place","Place / siège"]],
 "Voiture":[["loueur","Loueur"],["ref","N° de réservation"],["prise","Lieu de prise"],["restitution","Lieu de restitution"],["modele","Modèle"],["assurance","Assurance"]],
 "Trajet":[["depart","Départ"],["arrivee","Arrivée"],["duree","Durée estimée"],["distance","Distance"]],
 "Hôtel":[["ref","N° de réservation"],["checkin","Check-in"],["checkout","Check-out"],["chambre","N° de chambre"],["formule","Formule"]],
 "Restaurant":[["cuisine","Cuisine"],["heure","Heure de réservation"]],
 "Visite":[["horaires","Horaires d'ouverture"],["billet","N° de billet"],["dureec","Durée conseillée"]],
 "Activité":[["prestataire","Prestataire"],["ref","N° de réservation"],["duree","Durée"]],
 "Nature":[["depart","Départ"],["distance","Distance"],["duree","Durée"],["denivele","Dénivelé / difficulté"],["acces","Accès / parking"]],
 "Bien-être":[["prestataire","Institut / prestataire"],["heure","Heure de réservation"],["duree","Durée"]],
 "Autre":[]
};
const GROUP_NAMES=Object.keys(GROUPS);
function fToChamps(groupe,f){f=f||{};const defs=GROUPS[groupe]||[];const out=defs.map(([k,l])=>({label:l,value:f[k]||""}));
  Object.keys(f).forEach(k=>{if(!defs.some(d=>d[0]===k)&&f[k])out.push({label:k,value:f[k]});});return out;}
const NAME_L=["nom"],ADDR_L=["adresse","adresse / lieu","lieu"],TEL_L=["téléphone","telephone","tél","tel"];
function chFind(e,set){return (e.champs||[]).find(c=>set.includes((c.label||"").trim().toLowerCase()));}
function etName(e){if(e.titre&&e.titre.trim())return e.titre;const f=(e.champs||[]).find(c=>c.value);return f?f.value:"(sans nom)";}
function etAddr(e){const c=chFind(e,ADDR_L);return c?c.value:"";}
function etTel(e){const c=chFind(e,TEL_L);return c?c.value:"";}
function defChamps(groupe){const base=["Adresse","Téléphone"];const grp=(GROUPS[groupe]||[]).map(([k,l])=>l);return base.concat(grp).map(l=>({label:l,value:""}));}

/* ---- storage ---- */
let DB=null,MEM={},useMem=false;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("voyages2",1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore("kv");};
  r.onsuccess=e=>{DB=e.target.result;res();}; r.onerror=()=>{useMem=true;res();};}catch(e){useMem=true;res();}});}
function getKV(k){return new Promise(r=>{if(useMem)return r(MEM[k]);const t=DB.transaction("kv","readonly").objectStore("kv").get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(undefined);});}
function putKV(k,v){return new Promise(r=>{if(useMem){MEM[k]=v;return r();}const t=DB.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=()=>r();t.onerror=()=>r();});}

let DATA=null,view="itin",cur=null,SPK=null;
async function save(){await putKV("data",DATA);}
async function load(){const s=await getKV("data");if(s){DATA=s;migrate();}else{DATA=seed();}await save();}
function migrate(){const t=DATA.trip;if(!t)return;(t.jours||[]).forEach(j=>(j.etapes||[]).forEach(e=>{
  if(e.champs===undefined){e.champs=fToChamps(e.groupe,e.f||{});delete e.f;}
  if("nom"in e||"lieu"in e||"tel"in e){
    const has=l=>e.champs.some(c=>(c.label||"").trim().toLowerCase()===l.toLowerCase());
    const head=[];
    if(!has("Nom"))head.push({label:"Nom",value:e.nom||""});
    if(!has("Adresse"))head.push({label:"Adresse",value:e.lieu||""});
    if(!has("Téléphone"))head.push({label:"Téléphone",value:e.tel||""});
    e.champs=head.concat(e.champs);delete e.nom;delete e.lieu;delete e.tel;
  }
  if(e.actions===undefined){e.actions=(e.liens||[]).filter(l=>l&&(l.label||l.url)).map(l=>({type:"lien",label:l.label||"",url:l.url||""}));delete e.liens;}
  if(e.titre===undefined){const ni=(e.champs||[]).findIndex(c=>(c.label||"").trim().toLowerCase()==="nom");if(ni>=0){e.titre=e.champs[ni].value||"";e.champs.splice(ni,1);}else e.titre="";}
}));}
const trip=()=>DATA.trip;
function sortDay(j){if(j&&j.etapes)j.etapes.sort((a,b)=>(a.debut||"99:99").localeCompare(b.debut||"99:99"));}

/* ---- render ---- */
function render(){view==="detail"?renderDetail():renderItin();}

function renderItin(){
  const t=trip();
  const days=[...t.jours].sort((a,b)=>(a.date||"")<(b.date||"")?-1:1).map(j=>{sortDay(j);
    const evs=(j.etapes||[]).map(e=>`
      <div class="ev ${e.statut==='fait'?'done':''}">
        <div class="time">${timeStack(e)}</div>
        <div class="rail"><span class="dot"></span></div>
        <div class="c" onclick="openDetail('${j.id}','${e.id}')">
          <div class="txt"><div class="ttl">${esc(etName(e))}</div><div class="sub">${esc(e.groupe||"")}</div></div>
          <span class="chev">›</span></div>
      </div>`).join("")||'<div class="ev"><div class="time"></div><div class="rail"><span class="dot"></span></div><div class="c"><div class="txt"><div class="sub">Aucune étape</div></div></div></div>';
    return `<div class="day-h"><span class="d">${dShort(j.date)}</span><span class="t">${esc(j.titre)}</span><span class="edit" onclick="editDay('${j.id}')">Modifier</span></div>${evs}`;
  }).join("");
  $("app").innerHTML=`
    <div class="top"><span class="sp"></span><h1>${esc(t.titre)} (${VERSION})</h1><button class="add" onclick="editDay()">+</button></div>
    <div class="wrap">${t.jours.length?days:'<div class="empty">Aucune journée.</div>'}
      <button class="addday" onclick="editDay()">+ Ajouter une journée</button>
      <div class="ver">Mes Voyages · ${VERSION}</div>
    </div>`;
}

function renderDetail(){
  const j=trip().jours.find(x=>x.id===cur.jid);const e=j&&j.etapes.find(x=>x.id===cur.eid);
  if(!e){view="itin";return render();}
  const nm=etName(e),addr=etAddr(e),tel=etTel(e);
  const q=encodeURIComponent(addr||(nm!=="(sans nom)"?nm:""));
  const rows=[];
  (e.champs||[]).forEach(c=>{const lc=(c.label||"").trim().toLowerCase();if(c.value&&lc!=="nom"){const v=TEL_L.includes(lc)?`<a href="tel:${esc(c.value).replace(/\s/g,'')}">${esc(c.value)}</a>`:esc(c.value);rows.push(`<div class="row"><span class="k">${esc(c.label||"—")}</span><span class="v">${v}</span></div>`);}});
  if(e.cout)rows.push(`<div class="row cost"><span class="k">Coût</span><span class="v">${esc(e.cout)}</span></div>`);
  const reservePill=e.reserve===true?'<span class="pill ok">Réservé</span>':e.reserve===false?'<span class="pill no">À réserver</span>':"";
  const acts=[];
  (e.actions||[]).forEach((a,ai)=>{
    if(a.type==="lien"&&(a.label||a.url))acts.push(`<a class="act" ${a.url?`href="${esc(a.url)}" target="_blank" rel="noopener"`:""}><span class="ic">🔗</span><span>${esc(a.label||a.url||"Lien")}</span><span class="go">›</span></a>`);
    else if(a.type==="plan"&&(a.depart||a.arrivee))acts.push(`<a class="act" href="${dirUrl(a.depart,a.arrivee)}" target="_blank" rel="noopener"><span class="ic">🧭</span><span>${esc(a.label||((a.depart||"?")+" → "+(a.arrivee||"?")))}</span><span class="go">›</span></a>`);
    else if(a.type==="fichier"&&a.data)acts.push(`<a class="act" onclick="openAtt('${j.id}','${e.id}',${ai})"><span class="ic">📄</span><span>${esc(a.label||a.name||"Fichier")}</span><span class="go">›</span></a>`);
    else if(a.type==="photo"&&a.data)acts.push(`<a class="act" onclick="openImg('${j.id}','${e.id}',${ai})"><span class="ic">🖼</span><span>${esc(a.label||a.name||"Photo")}</span><span class="go">›</span></a>`);
    else if(a.type==="audio"&&a.texte){const pl=SPK&&SPK.jid===j.id&&SPK.eid===e.id&&SPK.ai===ai;acts.push(`<a class="act" onclick="speakAction('${j.id}','${e.id}',${ai})"><span class="ic">${pl?"⏸":"🔊"}</span><span>${pl?"Lecture en cours… (toucher pour arrêter)":esc(a.label||"Audio")}</span><span class="go">›</span></a>`);}
  });
  $("app").innerHTML=`
    <div class="top"><button class="back" onclick="back()">‹ Itinéraire</button><h1>${esc(j.titre)}</h1><span class="sp"></span></div>
    <div class="wrap">
      <div class="eyebrow">${[timeStack(e).replace("<br>"," – "),e.groupe].filter(Boolean).join(" · ")}</div>
      <div class="d-title">${esc(nm)}</div>
      ${reservePill}
      <div class="statusbar"><div class="chk ${e.statut==='fait'?'on':''}" onclick="toggleDone('${j.id}','${e.id}')">${e.statut==='fait'?'✓':''}</div>
        <span style="font-size:13px;color:var(--ink-2)">${e.statut==='fait'?'Fait':'À faire'}</span></div>
      ${rows.length?`<div class="sec-lbl">Infos</div><div class="card">${rows.join("")}</div>`:""}

function openAtt(jid,eid,ai){const e=trip().jours.find(x=>x.id===jid).etapes.find(x=>x.id===eid);const a=(e.actions||[])[ai];if(!a||!a.data)return;try{const url=URL.createObjectURL(dataUrlToBlob(a.data));window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(err){const w=window.open();if(w)w.location=a.data;}}
function back(){stopSpeak();view="itin";cur=null;render();}
function stopSpeak(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}SPK=null;}
function speakAction(jid,eid,ai){const e=trip().jours.find(x=>x.id===jid).etapes.find(x=>x.id===eid);const a=(e.actions||[])[ai];if(!a||!a.texte)return;
  if(!('speechSynthesis' in window)){alert("La lecture audio n'est pas disponible sur cet appareil.");return;}
  if(SPK&&SPK.jid===jid&&SPK.eid===eid&&SPK.ai===ai){stopSpeak();render();return;}
  stopSpeak();SPK={jid:jid,eid:eid,ai:ai};
  const chunks=a.texte.replace(/\s+/g,' ').trim().match(/[^.!?…]+[.!?…]*/g)||[a.texte];
  const voices=speechSynthesis.getVoices();const fr=voices.find(v=>/fr[-_]?FR/i.test(v.lang))||voices.find(v=>/^fr/i.test(v.lang));
  chunks.forEach((c,idx)=>{const u=new SpeechSynthesisUtterance(c.trim());u.lang="fr-FR";u.rate=DATA.audioRate||0.85;if(fr)u.voice=fr;if(idx===chunks.length-1)u.onend=()=>{if(SPK&&SPK.jid===jid&&SPK.eid===eid&&SPK.ai===ai){SPK=null;render();}};speechSynthesis.speak(u);});
  render();}
function setRate(r){DATA.audioRate=r;stopSpeak();save();render();}

let EDIT=null,EDIT_CTX=null;
function editEvent(jid,eid){const j=trip().jours.find(x=>x.id===jid);const e=j.etapes.find(x=>x.id===eid);

function addEvent(jid){const first=trip().jours[0];
  EDIT={id:uid(),debut:"",fin:"",groupe:"Visite",titre:"",cout:"",reserve:null,champs:defChamps("Visite"),actions:[],notes:"",statut:"prevu"};
  EDIT_CTX={jid:jid||(first?first.id:null),eid:null,origJid:null};renderEditor();}
function captureEditor(){
  EDIT.debut=val("f_debut");EDIT.fin=val("f_fin");EDIT.groupe=$("f_groupe").value;EDIT.cout=val("f_cout");EDIT.titre=val("f_titre");
  const rs=$("f_reserve").value;EDIT.reserve=rs===""?null:rs==="1";
  EDIT.champs=(EDIT.champs||[]).map((c,i)=>({label:$("cl_"+i)?$("cl_"+i).value.trim():c.label,value:$("cv_"+i)?$("cv_"+i).value.trim():c.value}));
  EDIT.actions=(EDIT.actions||[]).map((a,i)=>{
    const label=$("al_"+i)?$("al_"+i).value.trim():(a.label||"");
    if(a.type==="lien")return{type:"lien",label:label,url:$("au_"+i)?$("au_"+i).value.trim():a.url};
    if(a.type==="plan")return{type:"plan",label:label,depart:$("ad_"+i)?$("ad_"+i).value.trim():a.depart,arrivee:$("aa_"+i)?$("aa_"+i).value.trim():a.arrivee};
    if(a.type==="audio")return{type:"audio",label:label,texte:$("at_"+i)?$("at_"+i).value:(a.texte||"")};
    return Object.assign({},a,{label:label});
  });
  EDIT.notes=$("f_notes")?$("f_notes").value:EDIT.notes;
  if($("f_jour"))EDIT_CTX.jid=$("f_jour").value;
}
function onGroupChange(){captureEditor();if((EDIT.champs||[]).every(c=>!c.value))EDIT.champs=defChamps(EDIT.groupe);renderEditor();}
function addChamp(){captureEditor();EDIT.champs=EDIT.champs||[];EDIT.champs.push({label:"",value:""});renderEditor();}
function rmChamp(i){captureEditor();EDIT.champs.splice(i,1);renderEditor();}
function addAction(type){captureEditor();EDIT.actions=EDIT.actions||[];const a=type==="lien"?{type:"lien",label:"",url:""}:type==="plan"?{type:"plan",label:"",depart:"",arrivee:""}:type==="audio"?{type:"audio",label:"",texte:""}:{type:type,label:""};EDIT.actions.push(a);renderEditor();}
function rmAction(i){captureEditor();EDIT.actions.splice(i,1);renderEditor();}
async function pickFile(i){captureEditor();const inp=$("af_"+i),f=inp&&inp.files&&inp.files[0];if(!f)return;try{const data=await readFile(f);const lbl=((EDIT.actions[i]&&EDIT.actions[i].label)||"").trim()||f.name;EDIT.actions[i]={type:"fichier",label:lbl,name:f.name,mime:f.type,data:data};renderEditor();}catch(e){alert("Impossible de lire le fichier.");}}
async function pickPhoto(i){captureEditor();const inp=$("ap_"+i),f=inp&&inp.files&&inp.files[0];if(!f)return;try{const data=await readImage(f);const lbl=((EDIT.actions[i]&&EDIT.actions[i].label)||"").trim()||(f.name||"Photo");EDIT.actions[i]={type:"photo",label:lbl,name:f.name||"photo.jpg",data:data};renderEditor();}catch(e){alert("Impossible de lire la photo.");}}
function renderEditor(){
  const e=EDIT,isNew=EDIT_CTX.eid===null;
  const jourSel=`<div class="field"><label>Journée</label><select id="f_jour">${trip().jours.map(j=>`<option value="${j.id}" ${j.id===EDIT_CTX.jid?"selected":""}>${esc(dShort(j.date))} — ${esc(j.titre)}</option>`).join("")}</select></div>`;
  const champsRows=(e.champs||[]).map((c,i)=>`<div class="lienrow"><input id="cl_${i}" value="${esc(c.label)}" placeholder="Nom du champ (ex. Compagnie)"><input id="cv_${i}" value="${esc(c.value)}" placeholder="Valeur"><button class="btn ghost sm" style="margin-top:6px;color:var(--coral)" onclick="rmChamp(${i})">Supprimer ce champ</button></div>`).join("");
  const actRows=(e.actions||[]).map((a,i)=>{
    const rm=`<button class="btn ghost sm" style="margin-top:6px;color:var(--coral)" onclick="rmAction(${i})">Retirer</button>`;
    const lab=`<input id="al_${i}" value="${esc(a.label||"")}" placeholder="Intitulé (ce qui s'affiche dans la fiche)">`;
    if(a.type==="lien")return `<div class="actrow"><div class="ah">🔗 Lien</div>${lab}<input id="au_${i}" value="${esc(a.url)}" inputmode="url" placeholder="https://…">${rm}</div>`;
    if(a.type==="plan")return `<div class="actrow"><div class="ah">🧭 Plan (itinéraire)</div>${lab}<input id="ad_${i}" value="${esc(a.depart)}" placeholder="Départ (ex. Elounda)"><input id="aa_${i}" value="${esc(a.arrivee)}" placeholder="Arrivée (ex. Plaka)">${rm}</div>`;
    if(a.type==="fichier")return `<div class="actrow"><div class="ah">📄 Fichier</div>${lab}<label class="filebtn">${a.data?"Remplacer le fichier":"Choisir un fichier"}<input type="file" id="af_${i}" onchange="pickFile(${i})"></label>${a.name?`<div style="margin-top:6px;font-size:13px;color:var(--ink-2)">${esc(a.name)}</div>`:""}${rm}</div>`;

}
async function saveEvent(){captureEditor();if(!(EDIT.titre||"").trim()){alert("Donne un titre à l'étape.");return;}
  EDIT.actions=(EDIT.actions||[]).filter(a=>a.type==="lien"?(a.label||a.url):a.type==="plan"?(a.depart||a.arrivee):a.type==="audio"?(a.label||a.texte):a.data);
  EDIT.champs=(EDIT.champs||[]).filter(c=>c.label||c.value);
  const target=trip().jours.find(x=>x.id===EDIT_CTX.jid);if(!target)return;
  if(EDIT_CTX.eid===null){target.etapes.push(EDIT);}
  else{const orig=trip().jours.find(x=>x.id===EDIT_CTX.origJid);
    if(orig)orig.etapes=orig.etapes.filter(x=>x.id!==EDIT_CTX.eid);
    target.etapes.push(EDIT);
    if(orig&&orig!==target)sortDay(orig);}
  cur={jid:target.id,eid:EDIT.id};sortDay(target);
  await save();closeSheet();view="detail";render();}
